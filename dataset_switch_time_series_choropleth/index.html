<!DOCTYPE html>
<html lang="en">
<!-- TEMPLATE https://github.com/ONSdigital/Maps/choropleth -->

<head>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,600,700' rel='stylesheet' type='text/css'>
  <title>Choropleth Template</title>

  <meta name="template" content="choropleth">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="googlebot" content="indexifembedded" />

  <link rel="stylesheet" href="../lib/globalStyle.css" />
  <link href='../lib-maps/maplibre-gl.css' rel='stylesheet' />
  <link href='https://cdn.ons.gov.uk/vendor/accessible-autocomplete/3.0.1/accessible-autocomplete.min.css' rel='stylesheet' />
  <link rel="stylesheet" href="../lib-maps/mapStyle.css" />

  <link rel="stylesheet" href="./style.css" />

</head>

<body>

  <h5 id="accessibleSummary" class="visuallyhidden"></h5>


  <div id="controls">
    <div id="dataset-switch-container"></div>
  </div>


  <div aria-hidden="true" id="legend"></div>

  <div id="mapwrapper">
    <div id="mapstage">
      <div id="graphic" role="img" aria-labelledby="accessibleSummary" tabindex="-1">
        <!-- <img src="fallback.png" alt="[Chart]" /> -->
      </div>

      <div id="chart-overlay" class="chart-overlay hidden" aria-hidden="true">
        <button id="chart-overlay-close" class="chart-overlay-close" type="button" aria-label="Close chart">×</button>
        <div id="chart"></div>
      </div>
    </div>

    <div id="keycontainer">
      <div id="keyinfo"></div>
      <div id="keyscale"></div>
    </div>

    <div id="timeline-container">
      <div id="timeline-slider"></div>
    </div>
  </div>

  <h5 id="source">
  </h5>

  <script src="https://cdn.ons.gov.uk/vendor/d3/6.3.0/d3.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/accessible-autocomplete/3.0.1/accessible-autocomplete.min.js" type="text/javascript"></script>
  <script src="../lib/colours.js"></script>
  <script src="../lib/simple-statistics.min.js"></script>
  <script src="../lib-maps/topojson.v2.min.js"></script>
  <script src='../lib-maps/maplibre-gl.js'></script>

  <script src="./config.js"></script>
  <script src="./script.js" type="module"></script>

</body>

</html>
